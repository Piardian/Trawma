name: Real Binance walk-forward comparison
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Closed M1 bars per symbol (minimum 50000)"
        required: true
        default: "50000"
      symbols:
        description: "Space-separated Binance USD-M symbols"
        required: true
        default: "BTCUSDT SOLUSDT"
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -v
      - name: Fetch real taker delta and run walk-forward comparisons
        run: python scripts/run_real_comparison.py --count "${{ inputs.count }}" --symbols ${{ inputs.symbols }} --output artifacts/real_walk_forward_comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: trawma-real-walk-forward-report
          path: artifacts/real_walk_forward_comparison.json
          if-no-files-found: error
